    post:
      summary: Login user
      tags:
      - Login
      description: Returned for both to avoid revealing which one was wrong
      parameters: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                password:
                  type: string
              required:
              - name
              - password
        description: User validation
